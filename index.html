<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TADC terminal</title>

    <link rel="stylesheet" href="style.css">

    <script src="script/start_up.js" defer></script>
    <script src="script/icoontjes.js" defer></script>
    <script src="script/start_menu.js" defer></script>
    <script src="script/folderomgeving.js" defer></script>

    <troginhorse russian="troginhorsicus"></troginhorse>
</head>
<body>
    <div id="start_up" onclick="startup()"> <!-- Dit is de start-up scherm -->
        <div id="c_and_a_logo_startup">
            <img src="images/C&A logo (dark).png">
        </div>
    </div>

    <!-- Folderomgeving / OS explorer template -->

        <div id="folderomgeving_container">
            <div class="folder_omgeving">
                    <div class="folderomgeving_top">
                        <div class="name_and_icon">
                            <div class="icon_folderomgeving">
                                <img src="images/placeholder.png">
                            </div>
                            <div class="folder_location">
                                Exploring - C:\
                            </div>
                        </div>

                        <div class="folderomgeving_options">
                            <div class="option_box option_hide">
                                <img src="images/placeholder.png">
                            </div>
                            <div class="option_box option_minimalize">
                                <img src="images/placeholder.png">
                            </div>
                            <div class="option_box option_exit">
                                <img src="images/placeholder.png">
                            </div>
                        </div>
                        
                    </div>

                    <div class="folderomgeving_center">
                        <div class="folderomgevingcenteroptions_container">
                            <div class="folderomgevingcenter_option file">
                                <span><u>F</u>ile</span>
                            </div>
                            <div class="folderomgevingcenter_option edit">
                                <span><u>E</u>dit</span>
                            </div>
                            <div class="folderomgevingcenter_option folder">
                                <span><u>V</u>iew</span>
                            </div>
                            <div class="folderomgevingcenter_option folder">
                                <span><u>H</u>elp</span>
                            </div>
                        </div>
                        <div class="folderomgevingcenter_otheroptionscontainer">
                            <div class="welkeomgeving_tab">
                                <div class="welkeomgeving_icoontje">
                                </div>

                                <div class="welkeomgeving_text">
                                    placeholder
                                </div>

                                <div class="arrow_welkeomgevintab">
                                    <img src="https://images.icon-icons.com/1339/PNG/512/arrowpointingdown_87499.png">
                                </div>
                            </div>
                            <div class="otheroptions_buttons">
                                <div class="rowoptions rowoptions_1">
                                    <div class="otheroption_button">
                                        <img src="images/placeholder.png">
                                    </div>
                                </div>

                                <div class="rowoptions rowoptions_2">
                                    <div class="otheroption_button">
                                        <img src="images/placeholder.png">
                                    </div>
                                    <div class="otheroption_button">
                                        <img src="images/placeholder.png">
                                    </div>
                                </div>

                                <div class="rowoptions rowoptions_3">
                                    <div class="otheroption_button">
                                        <img src="images/placeholder.png">
                                    </div>
                                    <div class="otheroption_button">
                                        <img src="images/placeholder.png">
                                    </div>
                                    <div class="otheroption_button">
                                        <img src="images/placeholder.png">
                                    </div>
                                </div>

                                <div class="rowoptions rowoptions_4">
                                    <div class="otheroption_button">
                                        <img src="images/placeholder.png">
                                    </div>
                                </div>

                                <div class="rowoptions rowoptions_5">
                                    <div class="otheroption_button">
                                        <img src="images/placeholder.png">
                                    </div>
                                    <div class="otheroption_button">
                                        <img src="images/placeholder.png">
                                    </div>
                                </div>

                                <div class="rowoptions rowoptions_6">
                                    <div class="otheroption_button">
                                        <img src="images/placeholder.png">
                                    </div>
                                    <div class="otheroption_button">
                                        <img src="images/placeholder.png">
                                    </div>
                                    <div class="otheroption_button">
                                        <img src="images/placeholder.png">
                                    </div>

                                    
                                </div>
                            </div>
                        </div>
                        <div class="folderomgeving_omgeving">
                            <div class="folderprogram_container">
                                <div class="folder-program"> <!-- Template -->
                                    <div class="folderprogram_icon">
                                        <img src="images/placeholder.png">
                                    </div>
                                    <div class="folderprogram_text">
                                        text
                                    </div>
                                </div>
                                <div class="folder-program"> <!-- Template -->
                                    <div class="folderprogram_icon">
                                        <img src="images/placeholder.png">
                                    </div>
                                    <div class="folderprogram_text">
                                        text
                                    </div>
                                </div>
                            </div>
                            
                        </div>
                    </div>

                    <div class="folderomgeving_bottom">
                        <div class="howmany_selected">
                            <div class="objects">-- object(s)</div>
                        </div>
                        <div class="other_status"></div>
                    </div>
            </div>
            
        </div>

    <div id="main_computerinterface"> <!-- Alle belangrijke componenten van de computer interface (folderomgeving, programma's, hoofdscherm, enz.) staan hier -->
        
        <!-- apps hoofdscherm -->
            <div class="icoontjes_container">
                <div class="icoontje_template, template"> <!-- template element, 'doos' waarin app/folder zich vormgeeft -->
                    <div class="icoontje"> <!-- doos waarin afbeelding template komt -->
                        <img src=""></img> <!-- afbeelding voor de doos -->
                    </div>
                    <div class="icoontje_text">My Computer (test)</div> <!-- tekst van de app/folder -->
                </div>
            </div> 
        <!-- taskbar -->
        <header class="header"> <!-- Taskbar met start-tab en andere tabs -->

                    <div id="start_menu"> <!-- Startmenu -->
                        <div id="nameos_container">
                            <div id="name_os">Caine & Abel</div>
                        </div>
                        <div id="startmenuappsfolders_container">
                            <div class="option_startmenu, template"> <!-- Template startmenu optie -->
                                <div class="icoontje startmenu_icoontje"><img src="images/folder_template.png"></div>
                                <div class="startmenuoption_text">Programs</div>
                                <div class="arrow_startmenu"></div>
                                
                                <div class="optionsextratab_container"> <!-- !!! -->
                                    <div class="options_extratab, template">
                                        <div class="optionsextratab_icoontje"></div>
                                        <div class="optionsextratab_naam">
                                            Naam
                                        </div>
                                        <div class="arrow_extratab"></div>
                                    </div>
                                    
                                </div>
                            </div>
                            
                        </div>
                    </div>
                    

                    <ul class="nav__list">
                        <li class="start" onclick="openStartMenu('open')">
                            <img src=""><b>Start</b>
                        </li>
                        <li class="programapp">
                            <img src="images/placeholder.png"><div class="programmaapp_text">programma/app</div>
                        </li>
                    </ul>
            <div id="time">
                <div id="icon_time">
                    <img src="images/placeholder.png">
                </div>
                <div id="time_text">XX:XX AM</div>
            </div>
        </header>

    </div>
</body>
</html>
